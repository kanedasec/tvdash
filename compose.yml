name: tvdash

services:
  tvdash:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tvdash:local
    restart: unless-stopped
    init: true
    env_file:
      - ${TVDASH_ENV_FILE:-./backend/.env}
    environment:
      DB_PATH: /data/tvdash.db
      PORT: "8000"
    ports:
      - "${TVDASH_BIND_ADDRESS:-127.0.0.1}:${TVDASH_PORT:-8000}:8000"
    volumes:
      - tvdash-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tvdash-data:
